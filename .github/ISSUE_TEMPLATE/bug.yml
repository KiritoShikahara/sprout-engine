name: 不具合
description: 再現可能な不具合を報告する
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        再現手順と期待する動作を具体的に書いてください。秘密情報は貼らないでください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージやログがあれば貼る
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / コミット
      placeholder: 0.1.0 / abcdef12
  - type: dropdown
    id: environment
    attributes:
      label: 環境
      options:
        - Visual Studio 2022
        - Visual Studio 2026
        - その他
    validations:
      required: true
